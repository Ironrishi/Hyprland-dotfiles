
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.player { max-width: 360px; margin: 1.5rem auto; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
.cover { width: 100%; aspect-ratio: 1; position: relative; background: #0d1b2a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.cover-art { width: 100%; height: 100%; object-fit: cover; }
.cover-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; color: rgba(255,255,255,0.4); }
.visualizer { display: flex; align-items: flex-end; gap: 3px; height: 48px; }
.bar { width: 4px; background: rgba(255,255,255,0.5); border-radius: 2px; transition: height 0.1s; }
.info { padding: 16px 16px 8px; }
.track-name { font-size: 16px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.progress-wrap { padding: 0 16px; margin-top: 12px; }
.progress-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.progress-track { width: 100%; height: 3px; background: var(--color-border-tertiary); border-radius: 2px; cursor: pointer; position: relative; }
.progress-fill { height: 100%; border-radius: 2px; background: var(--color-text-primary); transition: width 0.5s linear; }
.controls { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 16px; }
.ctrl-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 50%; transition: color 0.15s, background 0.15s; }
.ctrl-btn:hover { color: var(--color-text-primary); background: var(--color-border-tertiary); }
.play-btn { width: 48px; height: 48px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
.play-btn:active { transform: scale(0.93); }
.vol-row { display: flex; align-items: center; gap: 8px; padding: 0 16px 16px; }
.vol-icon { color: var(--color-text-tertiary); }
.vol-slider { flex: 1; accent-color: var(--color-text-primary); }
.queue { border-top: 0.5px solid var(--color-border-tertiary); }
.queue-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 8px; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
.queue-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; transition: background 0.1s; border-radius: 0; }
.queue-item:hover { background: var(--color-border-tertiary); }
.queue-item.active { background: var(--color-background-primary); }
.q-num { font-size: 12px; color: var(--color-text-tertiary); width: 16px; text-align: center; flex-shrink: 0; }
.q-dot { width: 6px; height: 6px; background: var(--color-text-primary); border-radius: 50%; flex-shrink: 0; }
.q-info { flex: 1; min-width: 0; }
.q-title { font-size: 13px; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-artist { font-size: 11px; color: var(--color-text-tertiary); }
.q-dur { font-size: 12px; color: var(--color-text-tertiary); }
.shuffle-on { color: var(--color-text-primary) !important; }
</style>

<div class="player">
  <div class="cover">
    <div class="cover-fallback" id="coverFallback">
      <div class="visualizer" id="visualizer"></div>
    </div>
  </div>

  <div class="info">
    <div class="track-name" id="trackName">Nightcore — Hollow</div>
    <div class="artist" id="artistName">Nightcore Mix Vol. 3</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-row">
      <span id="elapsed">0:00</span>
      <span id="duration">3:42</span>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="ctrl-btn" id="prevBtn" title="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="play-btn" id="playBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.08 3.64L8 18.14V9.86zM16 6h2v12h-2z"/></svg>
    </button>
    <button class="ctrl-btn" id="repeatBtn" title="Repeat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <div class="vol-row">
    <svg class="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="75" step="1">
    <svg class="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16.5 3A9.95 9.95 0 0 1 21 12a9.95 9.95 0 0 1-4.5 9V3z"/></svg>
  </div>

  <div class="queue">
    <div class="queue-header"><span>Queue</span><span id="qCount">5 tracks</span></div>
    <div id="queueList"></div>
  </div>
</div>

<script>
const tracks = [
  { title: "Nightcore — Hollow", artist: "Nightcore Mix Vol. 3", dur: 222 },
  { title: "Nightcore — Alone", artist: "Nightcore Essentials", dur: 198 },
  { title: "Nightcore — Heathens", artist: "Nightcore Mix Vol. 1", dur: 214 },
  { title: "Nightcore — Demons", artist: "Nightcore Classics", dur: 236 },
  { title: "Nightcore — Believer", artist: "Nightcore Mix Vol. 2", dur: 187 },
];

let current = 0, playing = false, elapsed = 0, shuffle = false, repeat = false;
let interval = null;

const trackName = document.getElementById('trackName');
const artistName = document.getElementById('artistName');
const progressFill = document.getElementById('progressFill');
const elapsedEl = document.getElementById('elapsed');
const durationEl = document.getElementById('duration');
const playIcon = document.getElementById('playIcon');
const queueList = document.getElementById('queueList');
const visualizer = document.getElementById('visualizer');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

const bars = Array.from({length: 18}, (_, i) => {
  const b = document.createElement('div');
  b.className = 'bar';
  b.style.height = '4px';
  visualizer.appendChild(b);
  return b;
});

let vizInterval = null;
function animViz(on) {
  clearInterval(vizInterval);
  if (!on) { bars.forEach(b => b.style.height = '4px'); return; }
  vizInterval = setInterval(() => {
    bars.forEach(b => {
      const h = 8 + Math.random() * 36;
      b.style.height = h + 'px';
    });
  }, 120);
}

function loadTrack(i) {
  current = i;
  const t = tracks[i];
  trackName.textContent = t.title;
  artistName.textContent = t.artist;
  durationEl.textContent = fmt(t.dur);
  elapsed = 0;
  updateProgress();
  renderQueue();
}

function updateProgress() {
  const t = tracks[current];
  const pct = (elapsed / t.dur) * 100;
  progressFill.style.width = pct + '%';
  elapsedEl.textContent = fmt(elapsed);
}

function tick() {
  const t = tracks[current];
  elapsed += 1;
  if (elapsed >= t.dur) {
    elapsed = 0;
    if (repeat) { updateProgress(); return; }
    next();
    return;
  }
  updateProgress();
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    interval = setInterval(tick, 1000);
    animViz(true);
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    clearInterval(interval);
    animViz(false);
  }
}

function next() {
  let n;
  if (shuffle) {
    do { n = Math.floor(Math.random() * tracks.length); } while (n === current && tracks.length > 1);
  } else {
    n = (current + 1) % tracks.length;
  }
  loadTrack(n);
  if (playing) { clearInterval(interval); interval = setInterval(tick, 1000); }
}

function prev() {
  if (elapsed > 3) { elapsed = 0; updateProgress(); return; }
  loadTrack((current - 1 + tracks.length) % tracks.length);
  if (playing) { clearInterval(interval); interval = setInterval(tick, 1000); }
}

function renderQueue() {
  queueList.innerHTML = '';
  tracks.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'queue-item' + (i === current ? ' active' : '');
    item.innerHTML = `
      <div class="q-num">${i === current ? '<div class="q-dot"></div>' : i+1}</div>
      <div class="q-info"><div class="q-title">${t.title}</div><div class="q-artist">${t.artist}</div></div>
      <div class="q-dur">${fmt(t.dur)}</div>
    `;
    item.onclick = () => { loadTrack(i); if (!playing) togglePlay(); };
    queueList.appendChild(item);
  });
}

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;
shuffleBtn.onclick = () => { shuffle = !shuffle; shuffleBtn.classList.toggle('shuffle-on', shuffle); };
repeatBtn.onclick = () => { repeat = !repeat; repeatBtn.classList.toggle('shuffle-on', repeat); };

document.getElementById('progressTrack').onclick = function(e) {
  const rect = this.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  elapsed = Math.floor(pct * tracks[current].dur);
  updateProgress();
};

loadTrack(0);
</script>
